name: CI/CD Pipeline

on:
  push:
    branches: [dev, qa, prod, main]
  pull_request:
    branches: [dev, qa, prod, main]

env:
  DOCKER_IMAGE_NAME: syncscope-api-gateway

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate:
    name: Validate Kong Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install YAML validator
        run: |
          pip install pyyaml

      - name: Validate kong.yml syntax
        run: |
          python -c "import yaml; yaml.safe_load(open('kong.yml'))" && echo "✅ kong.yml is valid YAML"

      - name: Validate docker-compose.yml
        run: |
          cd local-dev && docker-compose config > /dev/null

      - name: Summary
        run: |
          echo "## ✅ Configuration Validation Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All configuration files are valid:" >> $GITHUB_STEP_SUMMARY
          echo "- kong.yml syntax is valid" >> $GITHUB_STEP_SUMMARY
          echo "- docker-compose.yml syntax is valid" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # DOCKER BUILD JOB
  # ===========================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## ✅ Docker Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Docker image built successfully:" >> $GITHUB_STEP_SUMMARY
          echo "- Image: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # INTEGRATION TEST JOB
  # ===========================================================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create test environment file
        run: |
          cp .dev.env .env

      - name: Start services
        run: |
          cd local-dev
          docker-compose up -d kong-database
          sleep 10
          docker-compose up kong-migration
          docker-compose up -d kong

      - name: Wait for Kong to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8081/status; do sleep 2; done'

      - name: Test Kong Admin API
        run: |
          # Test status endpoint
          curl -f http://localhost:8081/status

          # Test services endpoint
          curl -f http://localhost:8081/services

          # Test routes endpoint
          curl -f http://localhost:8081/routes

      - name: Test Kong Proxy
        run: |
          # Test proxy is listening
          curl -f http://localhost:8080 || echo "Kong proxy is listening"

      - name: Check Kong logs
        if: always()
        run: |
          cd local-dev && docker-compose logs kong

      - name: Cleanup
        if: always()
        run: |
          cd local-dev && docker-compose down -v

      - name: Summary
        if: success()
        run: |
          echo "## ✅ Integration Tests Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All integration tests passed successfully:" >> $GITHUB_STEP_SUMMARY
          echo "- Kong Gateway started successfully" >> $GITHUB_STEP_SUMMARY
          echo "- Health checks completed" >> $GITHUB_STEP_SUMMARY
          echo "- Admin API is accessible" >> $GITHUB_STEP_SUMMARY
          echo "- Proxy is listening" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # SECURITY SCAN JOB
  # ===========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Check for secrets in configuration
        run: |
          # Check for hardcoded secrets (basic check)
          if grep -r "password.*=.*['\"].*['\"]" --include="*.yml" --include="*.yaml" .; then
            echo "⚠️ Warning: Potential hardcoded passwords found"
          fi

      - name: Summary
        run: |
          echo "## ✅ Security Scan Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Security scan completed successfully" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # DOCUMENTATION CHECK JOB
  # ===========================================================================
  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "❌ README.md not found"
            exit 1
          fi
          echo "✅ README.md exists"

      - name: Check for TODO markers
        run: |
          if grep -r "TODO\|FIXME" --include="*.md" --include="*.yml" .; then
            echo "⚠️ Found TODO/FIXME markers in files"
          else
            echo "✅ No TODO/FIXME markers found"
          fi

      - name: Summary
        run: |
          echo "## ✅ Documentation Check Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Documentation check completed successfully" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # DEPLOYMENT JOB (only on push to main branches)
  # ===========================================================================
  deploy-check:
    name: Deployment Readiness Check
    runs-on: ubuntu-latest
    needs: [validate, build, integration-test, security]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check environment files
        run: |
          for env in dev qa prod; do
            if [ -f ".${env}.env" ]; then
              echo "✅ .${env}.env exists"
            else
              echo "❌ .${env}.env not found"
              exit 1
            fi
          done

      - name: Determine environment
        id: determine-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/prod" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "env_file=.prod.env" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/qa" ]]; then
            echo "environment=qa" >> $GITHUB_OUTPUT
            echo "env_file=.qa.env" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
            echo "env_file=.dev.env" >> $GITHUB_OUTPUT
          fi

      - name: Summary
        run: |
          echo "## ✅ Deployment Readiness Check Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ready for deployment to: ${{ steps.determine-env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Review the changes" >> $GITHUB_STEP_SUMMARY
          echo "2. Deploy to Railway using the ${{ steps.determine-env.outputs.env_file }} configuration" >> $GITHUB_STEP_SUMMARY
          echo "3. Verify the deployment with health checks" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # FINAL SUMMARY JOB
  # ===========================================================================
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [validate, build, integration-test, security, documentation]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## 🎉 CI/CD Pipeline Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Validation: ${{ needs.validate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ${{ needs.integration-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Documentation: ${{ needs.documentation.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.validate.result }}" == "success" ]] && \
             [[ "${{ needs.build.result }}" == "success" ]] && \
             [[ "${{ needs.integration-test.result }}" == "success" ]] && \
             [[ "${{ needs.security.result }}" == "success" ]] && \
             [[ "${{ needs.documentation.result }}" == "success" ]]; then
            echo "### ✅ All checks passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Some checks failed" >> $GITHUB_STEP_SUMMARY
          fi
