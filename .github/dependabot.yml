# Dependabot configuration for automatic dependency updates
# This will create pull requests for dependency updates and security fixes

version: 2
updates:
  # Docker dependencies (Kong Gateway and supporting images)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    assignees:
      - "AlejandroBeltre"
    commit-message:
      prefix: "docker:"
      include: "scope"
    target-branch: "dev"
    # Group Kong-related updates
    groups:
      kong-updates:
        patterns:
          - "kong*"
        update-types:
          - "minor"
          - "patch"
      postgres-updates:
        patterns:
          - "postgres*"
        update-types:
          - "minor"
          - "patch"
      monitoring-updates:
        patterns:
          - "prometheus*"
          - "grafana*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    assignees:
      - "AlejandroBeltre"
    commit-message:
      prefix: "ci:"
      include: "scope"
    target-branch: "dev"
    # Group GitHub Actions updates
    groups:
      actions-updates:
        patterns:
          - "actions/*"
        update-types:
          - "minor"
          - "patch"
