_format_version: "3.0"

# =============================================================================
# SyncScope API Gateway - Kong Declarative Configuration
# =============================================================================
# This configuration defines all services, routes, and plugins for the
# SyncScope microservices architecture.
# =============================================================================

# =============================================================================
# SERVICES
# =============================================================================
# Define upstream services with health checks and load balancing

services:
  # ---------------------------------------------------------------------------
  # Kong Health Check Service (for Railway health checks)
  # ---------------------------------------------------------------------------
  - name: kong-health-service
    url: http://localhost:8081/status
    protocol: http
    connect_timeout: 5000
    write_timeout: 5000
    read_timeout: 5000
    retries: 0
    tags:
      - health
      - internal

    routes:
      # Root home page route
      - name: gateway-home
        paths:
          - /
        methods:
          - GET
        strip_path: false
        preserve_host: false
        tags:
          - public
          - home
        plugins:
          - name: pre-function
            config:
              access:
                - |
                  local file = io.open("/usr/local/kong/static/index.html", "r")
                  if file then
                    local content = file:read("*a")
                    file:close()
                    kong.response.exit(200, content, {
                      ["Content-Type"] = "text/html; charset=utf-8",
                      ["Cache-Control"] = "public, max-age=3600"
                    })
                  else
                    kong.response.exit(404, "Home page not found", {
                      ["Content-Type"] = "text/plain"
                    })
                  end

      - name: kong-health-check
        paths:
          - /health
        methods:
          - GET
          - HEAD
        strip_path: false
        preserve_host: false
        tags:
          - health
          - public

