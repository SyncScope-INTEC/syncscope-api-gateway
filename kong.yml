_format_version: "3.0"

# =============================================================================
# SyncScope API Gateway - Kong Declarative Configuration
# =============================================================================
# This configuration defines all services, routes, and plugins for the
# SyncScope microservices architecture.
# =============================================================================

# =============================================================================
# SERVICES
# =============================================================================
# Define upstream services with health checks and load balancing

services:
  # ---------------------------------------------------------------------------
  # Auth Service (Port 8000)
  # ---------------------------------------------------------------------------
  - name: auth-service
    url: http://syncscope-auth-service:8000
    protocol: http
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3
    tags:
      - syncscope
      - auth

    routes:
      # Public authentication routes (no JWT required)
      - name: auth-login
        paths:
          - /auth/login
        methods:
          - POST
          - OPTIONS
        strip_path: false
        preserve_host: false
        tags:
          - public
          - auth

      - name: auth-register
        paths:
          - /auth/register
        methods:
          - POST
          - OPTIONS
        strip_path: false
        tags:
          - public
          - auth

      - name: auth-oauth-github
        paths:
          - /auth/oauth/github
          - /auth/github/url
          - /auth/github/callback
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
        tags:
          - public
          - auth

      # Protected authentication routes
      - name: auth-protected
        paths:
          - /auth
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        strip_path: false
        tags:
          - protected
          - auth

      # Health check endpoints
      - name: auth-health
        paths:
          - /auth/health
        strip_path: false
        tags:
          - public
          - health

  # ---------------------------------------------------------------------------
  # Monitoring Service (Port 8002)
  # ---------------------------------------------------------------------------
  - name: monitoring-service
    url: http://syncscope-monitoring-service:8002
    protocol: http
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3
    tags:
      - syncscope
      - monitoring

    routes:
      - name: monitoring-routes
        paths:
          - /monitoring
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        strip_path: false
        tags:
          - protected
          - monitoring

      - name: monitoring-health
        paths:
          - /monitoring/health
        strip_path: false
        tags:
          - public
          - health

  # ---------------------------------------------------------------------------
  # Management Service (Port 8001)
  # ---------------------------------------------------------------------------
  - name: management-service
    url: http://syncscope-management-service:8001
    protocol: http
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3
    tags:
      - syncscope
      - management

    routes:
      - name: management-routes
        paths:
          - /management
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        strip_path: false
        tags:
          - protected
          - management

      - name: management-health
        paths:
          - /management/health
        strip_path: false
        tags:
          - public
          - health

  # ---------------------------------------------------------------------------
  # Analytics Service (Port 8003)
  # ---------------------------------------------------------------------------
  - name: analytics-service
    url: http://syncscope-analytics-service:8003
    protocol: http
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3
    tags:
      - syncscope
      - analytics

    routes:
      - name: analytics-routes
        paths:
          - /analytics
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        strip_path: false
        tags:
          - protected
          - analytics

      - name: analytics-health
        paths:
          - /analytics/health
        strip_path: false
        tags:
          - public
          - health

  # ---------------------------------------------------------------------------
  # Alerts Service (Port 8004)
  # ---------------------------------------------------------------------------
  - name: alerts-service
    url: http://syncscope-alerts-service:8004
    protocol: http
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3
    tags:
      - syncscope
      - alerts

    routes:
      - name: alerts-routes
        paths:
          - /alerts
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        strip_path: false
        tags:
          - protected
          - alerts

      - name: alerts-health
        paths:
          - /alerts/health
        strip_path: false
        tags:
          - public
          - health

# =============================================================================
# GLOBAL PLUGINS
# =============================================================================
# Plugins applied to all routes

plugins:
  # ---------------------------------------------------------------------------
  # CORS Plugin - Enable cross-origin requests
  # ---------------------------------------------------------------------------
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "http://127.0.0.1:3000"
        - "https://syncscope-frontend-dev.up.railway.app"
        - "https://syncscope-frontend-qa.up.railway.app"
        - "https://syncscope-frontend-prod.up.railway.app"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
        - X-Request-ID
        - X-Auth-Token
      exposed_headers:
        - X-Auth-Token
        - X-Response-Time
        - X-Service-Name
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
        - X-RateLimit-Reset
      credentials: true
      max_age: 3600
      preflight_continue: false
    tags:
      - global
      - cors

  # ---------------------------------------------------------------------------
  # Request Size Limiting - Prevent oversized payloads
  # ---------------------------------------------------------------------------
  - name: request-size-limiting
    config:
      allowed_payload_size: 10
      size_unit: megabytes
      require_content_length: false
    tags:
      - global
      - security

  # ---------------------------------------------------------------------------
  # Response Transformer - Add custom headers
  # ---------------------------------------------------------------------------
  - name: response-transformer
    config:
      add:
        headers:
          - "X-Powered-By: SyncScope API Gateway"
          - "X-Kong-Version: 3.0"
    tags:
      - global
      - headers

  # ---------------------------------------------------------------------------
  # Request/Response Logging - Comprehensive logging
  # ---------------------------------------------------------------------------
  - name: file-log
    config:
      path: /tmp/kong-access.log
      reopen: true
    tags:
      - global
      - logging

# =============================================================================
# CONSUMERS
# =============================================================================
# Define API consumers for authentication

consumers:
  - username: anonymous
    tags:
      - anonymous

# =============================================================================
# NOTES
# =============================================================================
# 1. JWT Authentication Plugin:
#    - Applied at the route level for protected routes
#    - Configure JWT_SECRET_KEY in environment variables
#    - Token validation endpoint: /auth/verify-token
#
# 2. Rate Limiting Plugin:
#    - Configure different limits for anonymous vs authenticated users
#    - Apply at service or route level as needed
#
# 3. Caching:
#    - Implement proxy-cache plugin for cacheable endpoints
#    - Recommended for analytics reports and dashboard data
#
# 4. SSL/TLS:
#    - Configure certificates in Kong manager or via declarative config
#    - Enable HTTPS redirect for production
#
# 5. Service Discovery:
#    - Update service URLs based on your deployment environment
#    - Use environment variables for dynamic configuration
#
# 6. Load Balancing:
#    - Configure upstream targets for multiple service instances
#    - Implement health checks for automatic failover
#
# =============================================================================
