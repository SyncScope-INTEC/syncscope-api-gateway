# =============================================================================
# GLOBAL PLUGINS
# =============================================================================

plugins:
  # ---------------------------------------------------------------------------
  # CORS - Enable cross-origin requests
  # ---------------------------------------------------------------------------
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "http://127.0.0.1:3000"
        - "https://syncscope-frontend-dev.up.railway.app"
        - "https://syncscope-frontend-qa.up.railway.app"
        - "https://syncscope-frontend-prod.up.railway.app"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
        - X-Request-ID
        - X-Auth-Token
      exposed_headers:
        - X-Auth-Token
        - X-Response-Time
        - X-Service-Name
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
        - X-RateLimit-Reset
      credentials: true
      max_age: 3600
      preflight_continue: false
    tags:
      - global
      - cors

  # ---------------------------------------------------------------------------
  # Request Size Limiting
  # ---------------------------------------------------------------------------
  - name: request-size-limiting
    config:
      allowed_payload_size: 10
      size_unit: megabytes
      require_content_length: false
    tags:
      - global
      - security

  # ---------------------------------------------------------------------------
  # Response Transformer - Custom headers
  # ---------------------------------------------------------------------------
  - name: response-transformer
    config:
      add:
        headers:
          - "X-Powered-By: SyncScope API Gateway"
          - "X-Kong-Version: 3.0"
    tags:
      - global
      - headers

  # ---------------------------------------------------------------------------
  # Request/Response Logging
  # ---------------------------------------------------------------------------
  - name: file-log
    config:
      path: /tmp/kong-access.log
      reopen: true
    tags:
      - global
      - logging

# =============================================================================
# CONSUMERS
# =============================================================================

consumers:
  - username: anonymous
    tags:
      - anonymous

# =============================================================================
# NOTES
# =============================================================================
# Path Routing:
# - Gateway strips the service prefix (/auth, /monitoring, etc.)
# - Example: /auth/api/docs → backend receives /api/docs
# - Example: /monitoring/health → backend receives /health
#
# All services support:
# - API Documentation: /{service}/api/docs
# - Health Checks: /{service}/health
# - Full REST API: /{service}/*
#
# To access service APIs through gateway:
#   curl https://gateway.com/auth/api/docs
#   curl https://gateway.com/monitoring/health
#   curl https://gateway.com/management/api/schema
# =============================================================================
