_format_version: "3.0"

# =============================================================================
# SyncScope API Gateway - Kong Declarative Configuration
# =============================================================================
# Simplified routing with proper path stripping for all services
# =============================================================================

# =============================================================================
# SERVICES & ROUTES
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Gateway Root - API Information
  # ---------------------------------------------------------------------------
  - name: gateway-root-service
    url: http://localhost:8081/status
    protocol: http
    connect_timeout: 5000
    write_timeout: 5000
    read_timeout: 5000
    retries: 0
    tags:
      - gateway
      - internal

    routes:
      - name: gateway-home
        paths:
          - /
        methods:
          - GET
        strip_path: false
        preserve_host: false
        tags:
          - public
          - home
        plugins:
          - name: request-termination
            config:
              status_code: 200
              content_type: application/json
              body: '{"message":"Welcome to SyncScope API Gateway","version":"1.0.0","services":["auth","monitoring","management","analytics","alerts"],"endpoints":{"health":"/health","auth":"/auth","monitoring":"/monitoring","management":"/management","analytics":"/analytics","alerts":"/alerts"},"documentation":{"auth":"/auth/api/docs","monitoring":"/monitoring/api/docs","management":"/management/api/docs","analytics":"/analytics/api/docs","alerts":"/alerts/api/docs"}}'

  # ---------------------------------------------------------------------------
  # Kong Health Check (for Railway)
  # ---------------------------------------------------------------------------
  - name: kong-health-service
    url: http://localhost:8081/status
    protocol: http
    connect_timeout: 5000
    write_timeout: 5000
    read_timeout: 5000
    retries: 0
    tags:
      - health
      - internal

    routes:
      - name: kong-health-check
        paths:
          - /health
        methods:
          - GET
          - HEAD
        strip_path: false
        preserve_host: false
        tags:
          - health
          - public

  # ---------------------------------------------------------------------------
  # Auth Service
  # ---------------------------------------------------------------------------
  - name: auth-service
    url: https://syncscope-auth-service-dev.up.railway.app
    protocol: https
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3
    tags:
      - syncscope
      - auth

    routes:
      - name: auth-all
        paths:
          - /auth
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        strip_path: true
        preserve_host: false
        tags:
          - public
          - auth

  # ---------------------------------------------------------------------------
  # Monitoring Service
  # ---------------------------------------------------------------------------
  - name: monitoring-service
    url: https://syncscope-monitoring-service-dev.up.railway.app
    protocol: https
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3
    tags:
      - syncscope
      - monitoring

    routes:
      - name: monitoring-all
        paths:
          - /monitoring
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        strip_path: true
        preserve_host: false
        tags:
          - public
          - monitoring

  # ---------------------------------------------------------------------------
  # Management Service
  # ---------------------------------------------------------------------------
  - name: management-service
    url: https://syncscope-management-service-dev.up.railway.app
    protocol: https
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3
    tags:
      - syncscope
      - management

    routes:
      - name: management-all
        paths:
          - /management
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        strip_path: true
        preserve_host: false
        tags:
          - public
          - management

  # ---------------------------------------------------------------------------
  # Analytics Service
  # ---------------------------------------------------------------------------
  - name: analytics-service
    url: https://syncscope-analytics-service-dev.up.railway.app
    protocol: https
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3
    tags:
      - syncscope
      - analytics

    routes:
      - name: analytics-all
        paths:
          - /analytics
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        strip_path: true
        preserve_host: false
        tags:
          - public
          - analytics

  # ---------------------------------------------------------------------------
  # Alerts Service
  # ---------------------------------------------------------------------------
  - name: alerts-service
    url: https://syncscope-alerts-service-dev.up.railway.app
    protocol: https
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3
    tags:
      - syncscope
      - alerts

    routes:
      - name: alerts-all
        paths:
          - /alerts
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        strip_path: true
        preserve_host: false
        tags:
          - public
          - alerts

# =============================================================================
# GLOBAL PLUGINS
# =============================================================================

plugins:
  # ---------------------------------------------------------------------------
  # CORS - Enable cross-origin requests
  # ---------------------------------------------------------------------------
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "http://127.0.0.1:3000"
        - "https://syncscope-frontend-dev.up.railway.app"
        - "https://syncscope-frontend-qa.up.railway.app"
        - "https://syncscope-frontend-prod.up.railway.app"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
        - X-Request-ID
        - X-Auth-Token
      exposed_headers:
        - X-Auth-Token
        - X-Response-Time
        - X-Service-Name
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
        - X-RateLimit-Reset
      credentials: true
      max_age: 3600
      preflight_continue: false
    tags:
      - global
      - cors

  # ---------------------------------------------------------------------------
  # Request Size Limiting
  # ---------------------------------------------------------------------------
  - name: request-size-limiting
    config:
      allowed_payload_size: 10
      size_unit: megabytes
      require_content_length: false
    tags:
      - global
      - security

  # ---------------------------------------------------------------------------
  # Response Transformer - Custom headers
  # ---------------------------------------------------------------------------
  - name: response-transformer
    config:
      add:
        headers:
          - "X-Powered-By: SyncScope API Gateway"
          - "X-Kong-Version: 3.0"
    tags:
      - global
      - headers

  # ---------------------------------------------------------------------------
  # Request/Response Logging
  # ---------------------------------------------------------------------------
  - name: file-log
    config:
      path: /tmp/kong-access.log
      reopen: true
    tags:
      - global
      - logging

# =============================================================================
# CONSUMERS
# =============================================================================

consumers:
  - username: anonymous
    tags:
      - anonymous

# =============================================================================
# NOTES
# =============================================================================
# Path Routing:
# - Gateway strips the service prefix (/auth, /monitoring, etc.)
# - Example: /auth/api/docs → backend receives /api/docs
# - Example: /monitoring/health → backend receives /health
#
# All services support:
# - API Documentation: /{service}/api/docs
# - Health Checks: /{service}/health
# - Full REST API: /{service}/*
#
# To access service APIs through gateway:
#   curl https://gateway.com/auth/api/docs
#   curl https://gateway.com/monitoring/health
#   curl https://gateway.com/management/api/schema
# =============================================================================
