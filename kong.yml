# =============================================================================
# GLOBAL PLUGINS
# =============================================================================
# Plugins applied to all routes

plugins:
  # ---------------------------------------------------------------------------
  # CORS Plugin - Enable cross-origin requests
  # ---------------------------------------------------------------------------
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "http://127.0.0.1:3000"
        - "https://syncscope-frontend-dev.up.railway.app"
        - "https://syncscope-frontend-qa.up.railway.app"
        - "https://syncscope-frontend-prod.up.railway.app"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
        - X-Request-ID
        - X-Auth-Token
      exposed_headers:
        - X-Auth-Token
        - X-Response-Time
        - X-Service-Name
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
        - X-RateLimit-Reset
      credentials: true
      max_age: 3600
      preflight_continue: false
    tags:
      - global
      - cors

  # ---------------------------------------------------------------------------
  # Request Size Limiting - Prevent oversized payloads
  # ---------------------------------------------------------------------------
  - name: request-size-limiting
    config:
      allowed_payload_size: 10
      size_unit: megabytes
      require_content_length: false
    tags:
      - global
      - security

  # ---------------------------------------------------------------------------
  # Response Transformer - Add custom headers
  # ---------------------------------------------------------------------------
  - name: response-transformer
    config:
      add:
        headers:
          - "X-Powered-By: SyncScope API Gateway"
          - "X-Kong-Version: 3.0"
    tags:
      - global
      - headers

  # ---------------------------------------------------------------------------
  # Request/Response Logging - Comprehensive logging
  # ---------------------------------------------------------------------------
  - name: file-log
    config:
      path: /tmp/kong-access.log
      reopen: true
    tags:
      - global
      - logging

# =============================================================================
# CONSUMERS
# =============================================================================
# Define API consumers for authentication

consumers:
  - username: anonymous
    tags:
      - anonymous

# =============================================================================
# NOTES
# =============================================================================
# 1. JWT Authentication Plugin:
#    - Applied at the route level for protected routes
#    - Configure JWT_SECRET_KEY in environment variables
#    - Token validation endpoint: /auth/verify-token
#
# 2. Rate Limiting Plugin:
#    - Configure different limits for anonymous vs authenticated users
#    - Apply at service or route level as needed
#
# 3. Caching:
#    - Implement proxy-cache plugin for cacheable endpoints
#    - Recommended for analytics reports and dashboard data
#
# 4. SSL/TLS:
#    - Configure certificates in Kong manager or via declarative config
#    - Enable HTTPS redirect for production
#
# 5. Service Discovery:
#    - Update service URLs based on your deployment environment
#    - Use environment variables for dynamic configuration
#
# 6. Load Balancing:
#    - Configure upstream targets for multiple service instances
#    - Implement health checks for automatic failover
#
# =============================================================================
