  # ---------------------------------------------------------------------------
  # Kong Health Check (for Railway)
  # ---------------------------------------------------------------------------
  - name: kong-health-service
    url: http://localhost:8081/status
    protocol: http
    connect_timeout: 5000
    write_timeout: 5000
    read_timeout: 5000
    retries: 0
    tags:
      - health
      - internal

    routes:
      - name: kong-health-check
        paths:
          - /health
        methods:
          - GET
          - HEAD
        strip_path: false
        preserve_host: false
        tags:
          - health
          - public

  # ---------------------------------------------------------------------------
  # Auth Service
  # ---------------------------------------------------------------------------
