    url: https://syncscope-auth-service-dev.up.railway.app
    protocol: https
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3
    tags:
      - syncscope
      - auth

    routes:
      - name: auth-all
        paths:
          - /auth
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        strip_path: true
        preserve_host: false
        tags:
          - public
          - auth

