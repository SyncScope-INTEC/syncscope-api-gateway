_format_version: "3.0"

# =============================================================================
# SyncScope API Gateway - Kong Configuration with Load Balancing
# =============================================================================
# This configuration uses upstreams for proper load balancing across multiple
# service instances. Use this when scaling services horizontally.
#
# To use this configuration:
# 1. Rename kong.yml to kong-simple.yml (backup)
# 2. Rename this file to kong.yml
# 3. Update target addresses for your environment
# =============================================================================

# =============================================================================
# UPSTREAMS
# =============================================================================
# Define upstream targets with health checks and load balancing algorithms

upstreams:
  # ---------------------------------------------------------------------------
  # Auth Service Upstream
  # ---------------------------------------------------------------------------
  - name: auth-service-upstream
    algorithm: round-robin
    hash_on: none
    hash_fallback: none
    slots: 10000
    healthchecks:
      active:
        https_verify_certificate: false
        healthy:
          interval: 30
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
          timeouts: 3
      passive:
        healthy:
          successes: 5
        unhealthy:
          http_failures: 3
          timeouts: 3
    tags:
      - syncscope
      - auth
      - load-balanced
    targets:
      # Primary instance - Add more targets here for horizontal scaling
      - target: syncscope-auth-service:8000
        weight: 100

  # ---------------------------------------------------------------------------
  # Monitoring Service Upstream
  # ---------------------------------------------------------------------------
  - name: monitoring-service-upstream
    algorithm: round-robin
    hash_on: none
    hash_fallback: none
    slots: 10000
    healthchecks:
      active:
        https_verify_certificate: false
        healthy:
          interval: 30
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
          timeouts: 3
      passive:
        healthy:
          successes: 5
        unhealthy:
          http_failures: 3
          timeouts: 3
    tags:
      - syncscope
      - monitoring
      - load-balanced
    targets:
      - target: syncscope-monitoring-service:8002
        weight: 100

  # ---------------------------------------------------------------------------
  # Management Service Upstream
  # ---------------------------------------------------------------------------
  - name: management-service-upstream
    algorithm: round-robin
    hash_on: none
    hash_fallback: none
    slots: 10000
    healthchecks:
      active:
        https_verify_certificate: false
        healthy:
          interval: 30
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
          timeouts: 3
      passive:
        healthy:
          successes: 5
        unhealthy:
          http_failures: 3
          timeouts: 3
    tags:
      - syncscope
      - management
      - load-balanced
    targets:
      - target: syncscope-management-service:8001
        weight: 100

  # ---------------------------------------------------------------------------
  # Analytics Service Upstream
  # ---------------------------------------------------------------------------
  - name: analytics-service-upstream
    algorithm: round-robin
    hash_on: none
    hash_fallback: none
    slots: 10000
    healthchecks:
      active:
        https_verify_certificate: false
        healthy:
          interval: 30
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
          timeouts: 3
      passive:
        healthy:
          successes: 5
        unhealthy:
          http_failures: 3
          timeouts: 3
    tags:
      - syncscope
      - analytics
      - load-balanced
    targets:
      - target: syncscope-analytics-service:8003
        weight: 100

  # ---------------------------------------------------------------------------
  # Alerts Service Upstream
  # ---------------------------------------------------------------------------
  - name: alerts-service-upstream
    algorithm: round-robin
    hash_on: none
    hash_fallback: none
    slots: 10000
    healthchecks:
      active:
        https_verify_certificate: false
        healthy:
          interval: 30
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
          timeouts: 3
      passive:
        healthy:
          successes: 5
        unhealthy:
          http_failures: 3
          timeouts: 3
    tags:
      - syncscope
      - alerts
      - load-balanced
    targets:
      - target: syncscope-alerts-service:8004
        weight: 100

# =============================================================================
# SERVICES
# =============================================================================
# Services now point to upstreams instead of direct URLs

services:
  # ---------------------------------------------------------------------------
  # Auth Service (Port 8000)
  # ---------------------------------------------------------------------------
  - name: auth-service
    host: auth-service-upstream
    protocol: http
    port: 8000
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3
    tags:
      - syncscope
      - auth

    routes:
      # Public authentication routes (no JWT required)
      - name: auth-login
        paths:
          - /auth/login
        methods:
          - POST
          - OPTIONS
        strip_path: false
        preserve_host: false
        tags:
          - public
          - auth

      - name: auth-register
        paths:
          - /auth/register
        methods:
          - POST
          - OPTIONS
        strip_path: false
        tags:
          - public
          - auth

      - name: auth-oauth-github
        paths:
          - /auth/oauth/github
          - /auth/github/url
          - /auth/github/callback
        methods:
          - GET
          - POST
          - OPTIONS
        strip_path: false
        tags:
          - public
          - auth

      # Protected authentication routes
      - name: auth-protected
        paths:
          - /auth
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        strip_path: false
        tags:
          - protected
          - auth

      # Health check endpoints
      - name: auth-health
        paths:
          - /auth/health
        strip_path: false
        tags:
          - public
          - health

  # ---------------------------------------------------------------------------
  # Monitoring Service (Port 8002)
  # ---------------------------------------------------------------------------
  - name: monitoring-service
    host: monitoring-service-upstream
    protocol: http
    port: 8002
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3
    tags:
      - syncscope
      - monitoring

    routes:
      - name: monitoring-routes
        paths:
          - /monitoring
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        strip_path: false
        tags:
          - protected
          - monitoring

      - name: monitoring-health
        paths:
          - /monitoring/health
        strip_path: false
        tags:
          - public
          - health

  # ---------------------------------------------------------------------------
  # Management Service (Port 8001)
  # ---------------------------------------------------------------------------
  - name: management-service
    host: management-service-upstream
    protocol: http
    port: 8001
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3
    tags:
      - syncscope
      - management

    routes:
      - name: management-routes
        paths:
          - /management
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        strip_path: false
        tags:
          - protected
          - management

      - name: management-health
        paths:
          - /management/health
        strip_path: false
        tags:
          - public
          - health

  # ---------------------------------------------------------------------------
  # Analytics Service (Port 8003)
  # ---------------------------------------------------------------------------
  - name: analytics-service
    host: analytics-service-upstream
    protocol: http
    port: 8003
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3
    tags:
      - syncscope
      - analytics

    routes:
      - name: analytics-routes
        paths:
          - /analytics
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        strip_path: false
        tags:
          - protected
          - analytics

      - name: analytics-health
        paths:
          - /analytics/health
        strip_path: false
        tags:
          - public
          - health

  # ---------------------------------------------------------------------------
  # Alerts Service (Port 8004)
  # ---------------------------------------------------------------------------
  - name: alerts-service
    host: alerts-service-upstream
    protocol: http
    port: 8004
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3
    tags:
      - syncscope
      - alerts

    routes:
      - name: alerts-routes
        paths:
          - /alerts
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        strip_path: false
        tags:
          - protected
          - alerts

      - name: alerts-health
        paths:
          - /alerts/health
        strip_path: false
        tags:
          - public
          - health

# =============================================================================
# PLUGINS
# =============================================================================
# Global plugins applied to all routes and services

plugins:
  # ---------------------------------------------------------------------------
  # CORS - Cross-Origin Resource Sharing
  # ---------------------------------------------------------------------------
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "http://127.0.0.1:3000"
        - "https://syncscope-frontend-dev.up.railway.app"
        - "https://syncscope-frontend-qa.up.railway.app"
        - "https://syncscope-frontend-prod.up.railway.app"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
        - X-Auth-Token
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600
    tags:
      - global
      - cors

  # ---------------------------------------------------------------------------
  # Rate Limiting - Protect against abuse
  # ---------------------------------------------------------------------------
  - name: rate-limiting
    config:
      minute: 100
      hour: 10000
      policy: local
      fault_tolerant: true
      hide_client_headers: false
    tags:
      - global
      - rate-limiting

  # ---------------------------------------------------------------------------
  # Request Size Limiting - Prevent large payloads
  # ---------------------------------------------------------------------------
  - name: request-size-limiting
    config:
      allowed_payload_size: 10
      size_unit: megabytes
      require_content_length: false
    tags:
      - global
      - security

  # ---------------------------------------------------------------------------
  # Response Transformer - Add custom headers
  # ---------------------------------------------------------------------------
  - name: response-transformer
    config:
      add:
        headers:
          - "X-Powered-By: SyncScope API Gateway"
          - "X-Kong-Load-Balanced: true"
    tags:
      - global
      - headers

  # ---------------------------------------------------------------------------
  # Request/Response Logging - Comprehensive logging
  # ---------------------------------------------------------------------------
  - name: file-log
    config:
      path: /tmp/kong-access.log
      reopen: true
    tags:
      - global
      - logging

# =============================================================================
# CONSUMERS
# =============================================================================
# Define API consumers for authentication

consumers:
  - username: anonymous
    tags:
      - anonymous
